[platformio]
default_envs = powderreload

; Main PowderReload UI. Short press dispenses (motor turn + simulated weight),
; long press opens settings (target / tare / calibrate).
[env:powderreload]
build_src_filter = +<console_ui.cpp> +<bench_motor.cpp> +<storage.cpp> +<web.cpp>
board_build.filesystem = littlefs
; 1.9 MB app (x2 for future Wi-Fi updates), 190 KB for recipes and the log.
board_build.partitions = min_spiffs.csv
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
upload_port = COM7
monitor_port = COM7
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit seesaw Library@1.7.9
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.4.2
build_flags =
    -DUSER_SETUP_LOADED
    -include include/board_tft_setup.h

; Plain stepper bench (RPM selector + angle readout).
[env:stepper_bench]
extends = env:powderreload
build_src_filter = +<main.cpp> +<bench_motor.cpp>

; Older names still selectable in the VS Code PlatformIO toolbar: they flash the real UI too.
[env:bench_wroom]
extends = env:powderreload

[env:motor_display_bench]
extends = env:powderreload
